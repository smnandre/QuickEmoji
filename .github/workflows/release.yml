name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    uses: smnandre/.github/.github/workflows/macOS-release.yml@main
    with:
      runner: macos-26
      app_name: QuickEmoji
      binary_name: QuickEmoji
      bundle_id: dev.smnandre.quickemoji
      app_path: build/QuickEmoji.app
      dmg_directory: dist
      version_file: Config/Version.plist
      cask_token: quickemoji
    secrets: inherit
