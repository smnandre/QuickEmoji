name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check required secrets
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          MISSING=0
          for SECRET in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD APPLE_ID APPLE_NOTARIZATION_PASSWORD APPLE_TEAM_ID HOMEBREW_TAP_TOKEN; do
            if [ -z "${!SECRET}" ]; then
              echo "::error::Secret $SECRET is missing"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate stable release tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use stable vX.Y.Z format"
            exit 1
          fi
          CONFIG_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :Version' Config/Version.plist)
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Tag version $VERSION does not match Config/Version.plist $CONFIG_VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install tools
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install shellcheck swift-format yamllint

      - name: Run quality checks
        run: make test lint

      - name: Import signing certificate
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application.*\)".*/\1/p' | sed -n '1p')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in certificate"
            exit 1
          fi
          if [[ "$IDENTITY" != *"(${APPLE_TEAM_ID})" ]]; then
            echo "::error::Certificate identity does not belong to Team ID ${APPLE_TEAM_ID}"
            exit 1
          fi

          echo "APP_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$P12_PATH"

      - name: Build and sign app
        run: SIGNING_MODE=release APP_IDENTITY="$APP_IDENTITY" ./Scripts/build-app.sh

      - name: Verify signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          APP="build/QuickEmoji.app"
          INFO="$APP/Contents/Info.plist"

          file "$APP/Contents/MacOS/QuickEmoji" | grep 'arm64'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$INFO")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$INFO")" = "dev.smnandre.quickemoji"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep "TeamIdentifier=${APPLE_TEAM_ID}"

      - name: Create and sign DMG
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./Scripts/create-dmg.sh "$VERSION"
          codesign --force --timestamp --sign "$APP_IDENTITY" "dist/QuickEmoji-${VERSION}.dmg"
          codesign --verify --verbose=2 "dist/QuickEmoji-${VERSION}.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          RESULT=$(xcrun notarytool submit "dist/QuickEmoji-${VERSION}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --output-format json) || true

          echo "$RESULT"
          SUBMISSION_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status=$STATUS (submission: $SUBMISSION_ID)"
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_NOTARIZATION_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" || true
            exit 1
          fi

          NOTARY_LOG=$(xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID")
          echo "$NOTARY_LOG"
          ISSUE_COUNT=$(echo "$NOTARY_LOG" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('issues') or []))")
          if [ "$ISSUE_COUNT" -ne 0 ]; then
            echo "::error::Notarization completed with $ISSUE_COUNT issue(s)"
            exit 1
          fi

      - name: Staple and verify distributed DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          DMG="dist/QuickEmoji-${VERSION}.dmg"
          MOUNT_DIR="$RUNNER_TEMP/release-volume"
          APP="$MOUNT_DIR/QuickEmoji.app"

          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          hdiutil verify "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

          mkdir -p "$MOUNT_DIR"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DMG"
          trap 'hdiutil detach "$MOUNT_DIR"' EXIT

          file "$APP/Contents/MacOS/QuickEmoji" | grep 'arm64'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "dev.smnandre.quickemoji"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep "TeamIdentifier=${APPLE_TEAM_ID}"
          spctl --assess --type execute --verbose=2 "$APP"

          hdiutil detach "$MOUNT_DIR"
          trap - EXIT

      - name: Generate checksum
        id: checksum
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          DMG="dist/QuickEmoji-${VERSION}.dmg"
          SHA256=$(shasum -a 256 "$DMG" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "QuickEmoji-${VERSION}.dmg" > "${DMG}.sha256"
          echo "SHA256=$SHA256" >> "$GITHUB_OUTPUT"
          cat "${DMG}.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/QuickEmoji-${{ steps.version.outputs.VERSION }}.dmg
            dist/QuickEmoji-${{ steps.version.outputs.VERSION }}.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open Homebrew cask pull request
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ steps.checksum.outputs.SHA256 }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          BRANCH="release/quickemoji-v${VERSION}"
          CASK_PATH="Casks/quickemoji.rb"
          MAIN_CASK="$RUNNER_TEMP/main-quickemoji.rb"

          gh auth setup-git
          gh repo clone smnandre/homebrew-tap "$TAP_DIR"
          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH" origin/main
          fi

          "$GITHUB_WORKSPACE/Scripts/render-homebrew-cask.sh" \
            "$VERSION" \
            "$SHA256" \
            "$CASK_PATH"

          if git show "origin/main:$CASK_PATH" > "$MAIN_CASK" 2>/dev/null && cmp -s "$MAIN_CASK" "$CASK_PATH"; then
            echo "Cask v${VERSION} is already published on main"
            exit 0
          fi

          if [ -n "$(git status --short -- "$CASK_PATH")" ]; then
            git add "$CASK_PATH"
            git commit -m "quickemoji ${VERSION}"
            git push -u origin "$BRANCH"
          fi

          PR_NUMBER=$(gh pr list --repo smnandre/homebrew-tap --head "$BRANCH" --state all --json number --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_STATE=$(gh pr view "$PR_NUMBER" --repo smnandre/homebrew-tap --json state --jq '.state')
            case "$PR_STATE" in
              OPEN)
                echo "Homebrew cask pull request #${PR_NUMBER} is already open"
                ;;
              CLOSED)
                gh pr reopen "$PR_NUMBER" --repo smnandre/homebrew-tap
                ;;
              MERGED)
                gh pr create \
                  --repo smnandre/homebrew-tap \
                  --base main \
                  --head "$BRANCH" \
                  --title "quickemoji ${VERSION}" \
                  --body "Publish QuickEmoji v${VERSION}."
                ;;
            esac
          else
            gh pr create \
              --repo smnandre/homebrew-tap \
              --base main \
              --head "$BRANCH" \
              --title "quickemoji ${VERSION}" \
              --body "Publish QuickEmoji v${VERSION}."
          fi

      - name: Cleanup keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/build.keychain" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain"
          fi
