name: Website

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: smnandre/.github/.github/workflows/Pages.yml@73b564c9b3e173df776fc88a630d7ec524d30b77
    with:
      path: docs
