name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    uses: smnandre/.github/.github/workflows/macOS-preflight.yml@73b564c9b3e173df776fc88a630d7ec524d30b77
    with:
      version: ${{ inputs.version }}
      runner: macos-26
      app_name: QuickEmoji
      binary_name: QuickEmoji
      bundle_id: dev.smnandre.quickemoji
      app_path: build/QuickEmoji.app
      dmg_directory: dist
      version_file: Config/Version.plist
    secrets: inherit
