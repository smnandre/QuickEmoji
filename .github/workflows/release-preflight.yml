name: Release Preflight

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in the signed test artifact
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check required secrets
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          MISSING=0
          for SECRET in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_PASSWORD APPLE_ID APPLE_NOTARIZATION_PASSWORD APPLE_TEAM_ID HOMEBREW_TAP_TOKEN; do
            if [ -z "${!SECRET}" ]; then
              echo "::error::Secret $SECRET is missing"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use stable X.Y.Z format"
            exit 1
          fi
          CONFIG_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :Version' Config/Version.plist)
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "::error::Requested version $VERSION does not match Config/Version.plist $CONFIG_VERSION"
            exit 1
          fi

      - name: Install tools
        run: |
          if brew tap | grep -qx 'aws/tap'; then
            brew untap aws/tap
          fi
          brew install shellcheck swift-format yamllint

      - name: Run quality checks
        run: make test lint

      - name: Import and validate signing certificate
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/preflight.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          P12_PATH="$RUNNER_TEMP/certificate.p12"

          echo "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$P12_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVELOPER_ID_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application.*\)".*/\1/p' | sed -n '1p')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in certificate"
            exit 1
          fi
          if [[ "$IDENTITY" != *"(${APPLE_TEAM_ID})" ]]; then
            echo "::error::Certificate identity does not belong to Team ID ${APPLE_TEAM_ID}"
            exit 1
          fi

          echo "APP_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          rm -f "$P12_PATH"

      - name: Build and sign app
        run: SIGNING_MODE=release APP_IDENTITY="$APP_IDENTITY" ./Scripts/build-app.sh

      - name: Verify signed app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          APP="build/QuickEmoji.app"
          INFO="$APP/Contents/Info.plist"

          file "$APP/Contents/MacOS/QuickEmoji" | grep 'arm64'
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$INFO")" = "$VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$INFO")" = "dev.smnandre.quickemoji"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --display --verbose=4 "$APP" 2>&1 | grep 'Authority=Developer ID Application:'
          codesign --display --verbose=4 "$APP" 2>&1 | grep "TeamIdentifier=${APPLE_TEAM_ID}"

      - name: Create and sign test DMG
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./Scripts/create-dmg.sh "$VERSION"
          codesign --force --timestamp --sign "$APP_IDENTITY" "dist/QuickEmoji-${VERSION}.dmg"
          codesign --verify --verbose=2 "dist/QuickEmoji-${VERSION}.dmg"
          hdiutil verify "dist/QuickEmoji-${VERSION}.dmg"

      - name: Validate notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > /dev/null

      - name: Validate Homebrew tap token access
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail

          TOKEN_LOGIN=$(gh api user --jq '.login')
          if [ "$TOKEN_LOGIN" != "smnandre" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN belongs to ${TOKEN_LOGIN}, not smnandre"
            exit 1
          fi
          test "$(gh api repos/smnandre/homebrew-tap --jq '.full_name')" = "smnandre/homebrew-tap"
          gh pr list --repo smnandre/homebrew-tap --limit 1 > /dev/null

      - name: Cleanup keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -f "$RUNNER_TEMP/preflight.keychain" ]; then
            security delete-keychain "$RUNNER_TEMP/preflight.keychain"
          fi
