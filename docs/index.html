<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quick Emoji</title>
<meta name="description" content="A fast emoji and special-character picker for macOS.">
<link rel="canonical" href="https://smnandre.github.io/QuickEmoji/">
<meta property="og:type" content="website">
<meta property="og:title" content="Quick Emoji">
<meta property="og:description" content="Find any emoji and paste it in a keystroke.">
<meta property="og:url" content="https://smnandre.github.io/QuickEmoji/">
<meta property="og:image" content="https://smnandre.github.io/QuickEmoji/quickemoji-og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Quick Emoji for macOS">
<meta name="twitter:card" content="summary_large_image">
<style>
@layer reset, tokens, base, layout, components, motion;

@property --amb-hue {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

@layer reset {
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }
  ::selection { background: oklch(0.83 0.1 266 / 0.55); color: var(--ink); }
}

@layer tokens {
  :root {
    --h: 266;
    --bg: oklch(0.975 0.006 var(--h));
    --ink: oklch(0.34 0.02 var(--h));
    --ink-2: oklch(0.5 0.016 var(--h));
    --ink-3: oklch(0.62 0.012 var(--h));
    --focus: oklch(0.62 0.17 266);

    --lift-3: 0 24px 60px oklch(0.35 0.05 var(--h) / 0.16), 0 6px 16px oklch(0.35 0.04 var(--h) / 0.1);

    --r-card: 1.4rem;
    --r-cell: 0.7rem;

    --btn-dur: 200ms;
    --btn-dur-out: 400ms;
  }
}

@layer base {
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
    position: relative;
    isolation: isolate;
  }


  .ambient {
    position: fixed;
    inset: -25%;
    z-index: -1;
    filter: blur(64px) saturate(1.08) hue-rotate(var(--amb-hue, 0deg));
    pointer-events: none;
  }
  .ambient span {
    position: absolute;
    width: 42vmax;
    height: 42vmax;
    border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%;
    opacity: 0.42;
    mix-blend-mode: multiply;
    will-change: transform, border-radius;
  }
  .ambient span:nth-child(1) { top: -14%; left: -6%;  background: radial-gradient(closest-side, oklch(0.82 0.14 20 / 0.9), transparent); }
  .ambient span:nth-child(2) { top: -18%; right: -8%; background: radial-gradient(closest-side, oklch(0.83 0.13 60 / 0.9), transparent); }
  .ambient span:nth-child(3) { bottom: -20%; left: 12%; background: radial-gradient(closest-side, oklch(0.78 0.16 330 / 0.9), transparent); }
  .ambient span:nth-child(4) { bottom: -14%; right: 2%;  background: radial-gradient(closest-side, oklch(0.76 0.16 288 / 0.9), transparent); }
  .ambient span:nth-child(5) { top: 24%; left: 34%; background: radial-gradient(closest-side, oklch(0.8 0.14 222 / 0.85), transparent); }
  .ambient span:nth-child(6) { top: 44%; right: 24%; background: radial-gradient(closest-side, oklch(0.82 0.13 352 / 0.85), transparent); }
}

@layer layout {
  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: clamp(1rem, 2.5vw, 1.75rem) clamp(1.25rem, 5vw, 3.5rem);
  }

  .hero {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    align-items: center;
    gap: clamp(2rem, 5vw, 4rem);
    width: min(100%, 72rem);
    margin-inline: auto;
    padding: clamp(1rem, 4vh, 3rem) clamp(1.25rem, 5vw, 3.5rem) clamp(2rem, 5vh, 4rem);
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: clamp(1rem, 3vw, 1.75rem) clamp(1.25rem, 5vw, 3.5rem) clamp(1.5rem, 3vw, 2rem);
  }

  @media (max-width: 820px) {
    .hero {
      grid-template-columns: 1fr;
      gap: clamp(2.5rem, 8vw, 3.5rem);
      text-align: center;
    }
    .intro { order: 1; }
    .demo { order: 2; justify-self: center; }
    .actions { justify-content: center; }
    .kicker-row { align-items: center; }
  }
}

@layer components {

  .social { display: flex; gap: 1rem; }



  .kicker-row { display: flex; flex-direction: column; align-items: flex-start; gap: 1.15rem; margin-block-end: 1.6rem; }
  .app-icon { inline-size: clamp(4.2rem, 8.4vw, 5.6rem); aspect-ratio: 1; filter: drop-shadow(0 10px 22px oklch(0.4 0.05 var(--h) / 0.22)); }
  .app-icon svg { inline-size: 100%; block-size: 100%; }

  h1 {
    font-size: clamp(2.6rem, 6vw, 4.2rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 0.98;
    color: var(--ink);
  }
  .subtitle {
    margin-block-start: 1.2rem;
    max-inline-size: 20ch;
    font-size: clamp(1.6rem, 2.4vw, 2.1rem);
    line-height: 1.2;
    letter-spacing: -0.015em;
    color: var(--ink);
  }
  .features {
    margin-block-start: 1.15rem;
    max-inline-size: 42ch;
    list-style: none;
    display: grid;
    gap: 0.55rem;
    font-size: clamp(1rem, 1.2vw, 1.1rem);
    line-height: 1.4;
    color: var(--ink-2);
  }
  .features li { display: flex; align-items: flex-start; gap: 0.65rem; }
  .features li::before {
    content: "";
    flex: none;
    inline-size: 0.44rem;
    block-size: 0.44rem;
    margin-block-start: 0.5em;
    border-radius: 50%;
    background: var(--focus);
  }
  @media (max-width: 820px) {
    .subtitle, .features, .req { margin-inline: auto; }
    .features li { justify-content: center; }
  }

  .actions { display: flex; flex-wrap: wrap; gap: 1rem; margin-block-start: 2rem; }
  .req { margin-block-start: 1rem; font-size: 0.82rem; font-weight: 500; color: var(--ink-3); }

  .press {
    display: inline-flex;
    border-radius: var(--press-r, 0.7rem);
    box-shadow: 0 6px 12px oklch(0.4 0 0 / 0.12);
  }
  .press__cap {
    --lift: 3px;
    display: grid;
    place-items: center;
    border-radius: inherit;
    background: var(--cap-bg, oklch(0.98 0 0));
    color: var(--cap-ink, oklch(0.42 0.015 var(--h)));
    box-shadow: inset 0 1px 0 var(--cap-hl, oklch(1 0 0 / 0.5)), 0 var(--lift) 0 var(--cap-wall, oklch(0.86 0 0));
    transform: translateY(calc(-1 * var(--lift)));
    transition: transform var(--btn-dur-out) ease-out, box-shadow var(--btn-dur-out) ease-out;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    will-change: transform;
  }
  .press:hover .press__cap {
    --lift: 2px;
    transition: transform var(--btn-dur) ease, box-shadow var(--btn-dur) ease;
  }
  .press:active .press__cap,
  .press.is-down .press__cap {
    --lift: 1px;
    transition: transform var(--btn-dur) ease, box-shadow var(--btn-dur) ease;
  }


  .press--cta { --press-r: 0.8rem; }
  .press--cta .press__cap { display: inline-flex; align-items: center; gap: 0.75rem; padding: 0.9rem 1.6rem; font-size: 0.98rem; }
  .press--cta svg { inline-size: 1.1rem; block-size: 1.1rem; }
  .press--primary .press__cap {
    --cap-bg: linear-gradient(180deg, oklch(0.4 0.02 var(--h)), oklch(0.28 0.02 var(--h)));
    --cap-ink: oklch(0.99 0 0);
    --cap-wall: oklch(0.2 0.05 var(--h));
    --cap-hl: oklch(1 0 0 / 0.28);
  }
  .press--ghost .press__cap {
    --cap-bg: linear-gradient(180deg, oklch(1 0 0), oklch(0.93 0.008 var(--h)));
    --cap-ink: var(--ink);
    --cap-wall: oklch(0.84 0.014 var(--h));
    --cap-hl: oklch(1 0 0 / 0.9);
  }


  .press--icon { --press-r: 50%; }
  .press--icon .press__cap { inline-size: 2.5rem; block-size: 2.5rem; --cap-ink: var(--ink-2); }
  .press--icon svg { inline-size: 1.05rem; block-size: 1.05rem; }


  .demo { justify-self: center; width: 100%; max-inline-size: 23rem; }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1.25rem, 3vh, 1.75rem);
  }


  .picker {
    position: relative;
    width: 100%;
    border-radius: var(--r-card);
    padding: 1.15rem;
    background: oklch(0.99 0.004 var(--h) / 0.42);
    box-shadow: var(--lift-3);
    -webkit-backdrop-filter: blur(26px) saturate(1.7);
    backdrop-filter: blur(26px) saturate(1.7);
    opacity: 0;
    transform: translateY(10px) scale(0.97);
    transform-origin: top center;
    transition: opacity 0.28s ease, transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .picker.is-shown { opacity: 1; transform: none; }

  .picker::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.7);
    pointer-events: none;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.7rem 0.85rem;
    border-radius: 0.85rem;
    background: oklch(0.97 0.004 var(--h) / 0.55);
    box-shadow: inset 0 1px 3px oklch(0.4 0.03 var(--h) / 0.1);
    color: var(--ink-3);
  }
  .search svg { inline-size: 1.05rem; block-size: 1.05rem; flex: none; }
  .query { color: var(--ink); font-weight: 500; white-space: pre; }
  .query:empty::before { content: "Search emoji"; color: var(--ink-3); font-weight: 400; }
  .caret {
    inline-size: 2px;
    block-size: 1.05em;
    background: var(--focus);
    border-radius: 2px;
    animation: blink 1.1s steps(1) infinite;
  }

  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.25rem; margin-block-start: 0.9rem; }
  .grid button {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    border-radius: var(--r-cell);
    font-size: 1.5rem;
    line-height: 1;
    opacity: 0;
    transform: translateY(6px) scale(0.9);
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s;
    transition-delay: calc(var(--i) * 32ms);
  }
  .grid.is-open button { opacity: 1; transform: none; }
  .grid button:hover { background: oklch(0.9 0.01 var(--h) / 0.8); }
  .grid button.is-selected { background: oklch(0.96 0.02 266); box-shadow: 0 0 0 2px var(--focus); }


  .foot-left, .foot-right {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.35rem 1rem;
    font-size: 0.8rem;
    color: var(--ink-3);
  }
  .footer a { transition: color 0.2s; }
  .footer a:hover { color: var(--ink-2); }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 0.4rem; }
}

@layer motion {
  @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

  @keyframes hueShift { to { --amb-hue: 360deg; } }

  @keyframes morph {
    0%   { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%; }
    25%  { transform: translate3d(4%, -3%, 0) scale(1.12) rotate(28deg); border-radius: 62% 38% 45% 55% / 55% 60% 40% 45%; }
    50%  { transform: translate3d(-2%, 4%, 0) scale(0.94) rotate(-18deg); border-radius: 40% 60% 58% 42% / 44% 52% 48% 56%; }
    75%  { transform: translate3d(3%, 2%, 0) scale(1.06) rotate(14deg); border-radius: 55% 45% 42% 58% / 58% 44% 56% 42%; }
    100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); border-radius: 46% 54% 52% 48% / 50% 46% 54% 50%; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .ambient { animation: hueShift 26s linear infinite; }
    .ambient span { animation: morph 24s ease-in-out infinite; }
    .ambient span:nth-child(2) { animation-duration: 30s; animation-direction: reverse; }
    .ambient span:nth-child(3) { animation-duration: 28s; animation-delay: -6s; }
    .ambient span:nth-child(4) { animation-duration: 34s; animation-direction: reverse; animation-delay: -10s; }
    .ambient span:nth-child(5) { animation-duration: 26s; animation-delay: -14s; }
    .ambient span:nth-child(6) { animation-duration: 32s; animation-direction: reverse; animation-delay: -4s; }
  }
}


body.showcase main.hero { transform: scale(1.1); transition: transform 600ms ease; }
body.showcase .topbar,
body.showcase .footer {
  opacity: 0;
  pointer-events: none;
  transition: opacity 400ms ease;
}
body.showcase .subtitle,
body.showcase .features,
body.showcase .req,
body.showcase .actions {
  opacity: 0;
  pointer-events: none;
  max-height: 0;
  margin: 0;
  overflow: hidden;
  transition: opacity 300ms ease, max-height 500ms ease, margin 500ms ease;
}
body.showcase .ambient,
body.showcase .ambient span { animation: none; }
</style>

        <div class="picker">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <span class="query" id="query"></span>
            <span class="caret"></span>
          </div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const codePoints = [0x1F642, 0x1F600, 0x1F603, 0x1F604, 0x1F601, 0x1F60A, 0x1F606, 0x1F605, 0x1F602, 0x1F972];
    const term = "smile";
    const targetIndex = 4;

    const grid = document.getElementById("grid");
    const query = document.getElementById("query");
    const picker = document.querySelector(".picker");

    const cells = codePoints.map((cp, i) => {
      const el = document.createElement("button");
      el.type = "button";
      el.style.setProperty("--i", i);
      el.textContent = String.fromCodePoint(cp);
      grid.append(el);
      return el;
    });

    const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    async function loop() {
      while (true) {
        picker.classList.remove("is-shown");
        query.textContent = "";
        grid.classList.remove("is-open");
        cells[targetIndex].classList.remove("is-selected");
        await sleep(800);

        picker.classList.add("is-shown");
        await sleep(450);

        query.textContent = term;
        await sleep(250);
        grid.classList.add("is-open");
        await sleep(850);

        cells[targetIndex].classList.add("is-selected");
        await sleep(320);
        await sleep(1700);
        await sleep(300);
      }
    }

    if (reduce) {
      picker.classList.add("is-shown");
      query.textContent = term;
      grid.classList.add("is-open");
    } else {
      loop();
    }
  </script>

  <script>
    (function () {
      let last = 0;
      document.addEventListener("keydown", function (e) {
        if (e.key !== "Shift") return;
        const now = Date.now();
        if (now - last < 400) {
          document.body.classList.toggle("showcase");
          last = 0;
        } else {
          last = now;
        }
      });
    })();
  </script>
</body>
